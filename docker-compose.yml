services:
  event-booking-db:
    image: postgres:16-alpine
    container_name: event-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: event_admin
      POSTGRES_PASSWORD: event_secure_pass_2026
      POSTGRES_DB: event_booking_db
    ports:
      - "5433:5432"
    volumes:
      - event_booking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_admin -d event_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  event_booking_db_data:
    name: event_booking_db_data
